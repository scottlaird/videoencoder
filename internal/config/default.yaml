# Built-in defaults: the lowest config layer. Every layer uses this
# same schema; maps merge key by key, scalars and lists replace, and
# null deletes an entry of a map keyed by name (sources, encoders,
# renditions, videos, publish.targets) and changes nothing elsewhere.

# Where intermediate renditions and the finished stream go. Relative
# paths are relative to the video's directory; {name} is the video's
# name.
outdir: transcodes/{name}
streamdir: stream/{name}

# The length of the stream's segments. Players switch renditions only
# at segment boundaries, so every rendition gets a keyframe at each
# multiple of this, and an encoder's gop_args cap its own keyframe
# interval at one segment. Shorter segments let players adapt sooner
# but cost a little bitrate, since keyframes are expensive.
segment_duration: 5s

# Copy each source file into the stream directory under its own name,
# so it's published with the renditions: for sharing originals, such as
# test clips that people should be able to re-encode themselves.
copy_sources: false

# Seek thumbnails: a frame every interval seconds, height pixels high,
# tiled columns x rows to a JPEG, and added to dash.mpd (as a DASH-IF
# thumbnail AdaptationSet) and hls.m3u8 (as an image playlist).
thumbnails:
  enabled: true
  interval: 5
  height: 180
  columns: 5
  rows: 5

# The still image that represents the video. It is taken at offset (a
# time in seconds, "1.5s", or "MM:SS.ms") and written at each width up
# to the source's, and at the source's own width, in each format, as
# poster-<tone>-<width>.<key>.<format>, listed in poster.json. SDR
# posters come from an SDR source, or are tone-mapped from an HDR one.
#
# With an HDR source, gainmap_formats also get gain-mapped posters,
# poster-gainmap-<width>.<key>.<format>: an SDR image that HDR displays
# brighten to the HDR rendition. JPEGs are Ultra HDR (ISO 21496-1 and
# hdrgm XMP), written by videoencoder itself; AVIFs need avifgainmaputil
# from libavif. Plain PQ HDR AVIFs (poster-hdr-...) are only made with
# hdr: true; browsers tone-map them poorly on SDR displays.
#
# The best poster of each size and format, gain-mapped where there is
# one and SDR otherwise, is also copied to a fixed name:
# poster-<width>.<format>, and poster.<format> at full resolution.
poster:
  offset: 1s
  widths: [320, 640, 1280, 1920, 3840]
  formats: [avif, jpg]
  gainmap_formats: [jpg, avif]
  hdr: false

# Presets are named encoder settings. An encoder (below) names one with
# preset, and its own fields replace the preset's: so a sidecar can
# switch a slot to another encoder with just "h265: {preset:
# hevc-videotoolbox}", or add an option with extra_args, which follow
# args, without repeating the rest. A preset is:
#
#   codec          the ffmpeg encoder
#   quality_flag   the option quality goes in; for known codecs it
#                  defaults to the usual one (-crf, -q:v, -cq:v...)
#   quality        for renditions that set none; known codecs have a
#                  typical default
#   args           the encoder's fixed options
#   gop_args       options capping the keyframe interval at one segment,
#                  with "{gop}" replaced by the frames in a segment at
#                  the source's frame rate; every encode also forces a
#                  keyframe at each segment boundary
#   extra_args     more options, after args and gop_args
#   cap_bitrate    pass each rendition's bitrate as -b:v, with -maxrate
#                  and -bufsize at 1.5x; otherwise it's only a label
#   sdr_only       make only SDR renditions: from an SDR source, or
#                  tone-mapped from HDR if there's none
#
# Quality numbers belong to a codec: CRF 20 for libx265 isn't -q:v 20
# for VideoToolbox, where higher is better. So a rendition's tuned
# quality records its codec (tuned_for), and switching the encoder to
# another codec asks for a new tune rather than reusing it.
#
# Pixel formats are explicit: encoders otherwise keep the source's,
# and 4:2:2 or 10-bit H.264 (and 4:2:2 HEVC) play almost nowhere.
presets:
  x264-faster:
    codec: libx264
    quality: 18
    # 8-bit 4:2:0 High profile: what browsers and hardware decode.
    args: [-preset, faster, -pix_fmt, yuv420p, -profile:v, high]
    gop_args: [-g, "{gop}"]
    cap_bitrate: true
    # 8-bit PQ is all banding and few devices play it.
    sdr_only: true
  x265-faster:
    codec: libx265
    quality: 20
    # Main 10, 4:2:0. hvc1, not ffmpeg's default hev1, for Apple players.
    args: [-preset, faster, -pix_fmt, yuv420p10le, -profile:v, main10, -tag:v, hvc1]
    # x265's GOPs are open by default, which makes its forced keyframes
    # CRA frames, not IDR; cgop closes them so each segment starts
    # clean. (-flags, unlike -x265-params, doesn't collide with an
    # extra_args -x265-params.)
    gop_args: [-g, "{gop}", -flags, +cgop]
    cap_bitrate: true
  svtav1-p5:
    codec: libsvtav1
    quality: 31
    # 10-bit compresses better than 8-bit even from 8-bit sources, and
    # every AV1 decoder supports it.
    args: [-preset, "5", -pix_fmt, yuv420p10le]
    gop_args: [-g, "{gop}"]
  # Apple's hardware encoders, on macOS. -q:v (constant quality) needs
  # Apple silicon. Without -g, ffmpeg gives them a keyframe every 12
  # frames. They don't honor -maxrate the way the software encoders
  # do, so bitrates are labels.
  hevc-videotoolbox:
    codec: hevc_videotoolbox
    args: [-pix_fmt, p010le, -profile:v, main10, -tag:v, hvc1]
    gop_args: [-g, "{gop}"]
  h264-videotoolbox:
    codec: h264_videotoolbox
    args: [-pix_fmt, nv12, -profile:v, high]
    gop_args: [-g, "{gop}"]
    sdr_only: true

# The ladder's encoder slots, which renditions name. Delete one with
# null, and its renditions go with it: "h264: null" makes no H.264.
encoders:
  h264: {preset: x264-faster}
  h265: {preset: x265-faster}
  av1: {preset: svtav1-p5}

# How "videoencoder tune" picks rendition qualities: it encodes each
# of ranges (duration seconds from start) of each source (SDR
# renditions from the SDR source, HDR ones from the HDR source),
# searching each
# encoder's anchor renditions (the shortest and tallest each VMAF model
# scores; anchors: 3 adds the middle) for the quality setting that
# just reaches target_vmaf on every range, interpolates
# the rest, and writes quality and bitrate into the video's sidecar
# (under hdr for HDR renditions).
# Each rendition is scored against the sample at its own size (with
# the 4K model at 2160p); HDR is tone-mapped to SDR for scoring. A
# rendition's own target_vmaf overrides this one. Renditions with
# tune: false or quality_from, and any taller than 2160p, which VMAF
# can't judge, are left as configured. Every trial is logged to
# tune-results.csv in outdir, and later runs reuse the ones that still
# apply.
#
# vmaf_model is "v0", libvmaf's built-in v0.6.1 (and its 4K variant at
# 2160p), or the path of a libvmaf JSON model, relative to the video's
# directory; vmaf_model_2160, if set, replaces it for 2160p and up.
# Scores, and so target_vmaf, mean different things for each model. An
# HDR model (one with a PQ conversion_target, like Netflix's
# hdr_vmaf_v1.1.8) scores HDR as HDR, without tone-mapping it. hdr sets
# target_vmaf and the models for HDR renditions; unset, they follow the
# SDR ones.
#
#   tune:
#     target_vmaf: 95
#     ranges:              # skip a title sequence, but check it too
#       - {start: 0s, duration: 4s}
#       - {start: 30s, duration: 8s}
#     hdr:
#       target_vmaf: 93
#       vmaf_model: /opt/vmaf/hdr_vmaf_v1.1.8_3d0h.json
#       vmaf_model_2160: /opt/vmaf/hdr_vmaf_v1.1.8_1d5h_2160.json
tune:
  target_vmaf: 95
  ranges:
    - {start: 0s, duration: 8s}
  anchors: 2
  vmaf_model: v0

# Renditions taller than the source are dropped. If an encoder's
# tallest rendition is shorter than the source, that encoder also gets
# one rendition at the source's own resolution. A rendition can take
# its quality from another of the same encoder, resolved after every
# layer is merged, so it follows tune:
#
#   av1-3240: {quality_from: av1-2160, quality_offset: 2}
#
# A rendition without a quality takes its encoder's.
renditions:
  h264-480:  {encoder: h264, height: 480,  bitrate: 1M}
  h264-720:  {encoder: h264, height: 720,  bitrate: 2M}
  h264-1080: {encoder: h264, height: 1080, bitrate: 4M}
  h265-480:  {encoder: h265, height: 480,  bitrate: 800k}
  h265-720:  {encoder: h265, height: 720,  bitrate: 1M}
  h265-1080: {encoder: h265, height: 1080, bitrate: 2M}
  h265-1440: {encoder: h265, height: 1440, bitrate: 3M}
  h265-2160: {encoder: h265, height: 2160, bitrate: 4M}
  av1-480:   {encoder: av1,  height: 480,  bitrate: 700k}
  av1-720:   {encoder: av1,  height: 720,  bitrate: 1M}
  av1-1080:  {encoder: av1,  height: 1080, bitrate: 2M}
  av1-1440:  {encoder: av1,  height: 1440, bitrate: 3M}
  av1-2160:  {encoder: av1,  height: 2160, bitrate: 4M}
  av1-3240:  {encoder: av1,  height: 3240, bitrate: 5M}
  av1-4320:  {encoder: av1,  height: 4320, bitrate: 8M}

# Where finished streams are copied after rendering: a local directory
# or an S3-compatible bucket. "to" names the targets used by default.
# Credentials come from AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY or
# ~/.aws/credentials (s3.profile), never from config; an empty
# s3.endpoint means $S3_ENDPOINT_URL. --prune deletes objects that are
# no longer part of the stream, and is only allowed when the target's
# dir or prefix contains {name}, so it can't touch other videos.
#
#   publish:
#     to: [seaweed]
#     targets:
#       www:     {dir: /srv/www/videos/{name}}
#       seaweed: {s3: {bucket: video, prefix: "{name}/"}}
publish:
  to: []
  targets: {}
